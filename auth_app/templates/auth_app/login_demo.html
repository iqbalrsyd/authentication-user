<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authentication Demo</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
    section { border: 1px solid #ddd; border-radius: 10px; margin: 20px 0; padding: 20px; }
    input, button { box-sizing: border-box; display: block; margin: 10px 0; padding: 10px; width: 100%; }
    #captcha-image { border: 1px solid #ddd; border-radius: 8px; display: block; max-width: 100%; min-height: 84px; }
    pre { background: #f5f5f5; border-radius: 8px; min-height: 80px; overflow-wrap: anywhere; padding: 14px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Authentication Demo</h1>
  <p>Halaman ini hanya tersedia ketika <code>AUTH_DEMO_ENABLED=True</code>.</p>

  <section>
    <h2>Sign in with Google</h2>
    <div id="google-button"></div>
    <p id="google-setup"></p>
  </section>

  <section>
    <h2>Login dengan OTP email</h2>
    <form id="otp-request-form">
      <input id="email" type="email" placeholder="Email terverifikasi" required>
      <img id="captcha-image" alt="CAPTCHA 6 karakter">
      <button id="captcha-refresh" type="button">Ganti CAPTCHA</button>
      <input id="captcha-answer" type="text" maxlength="6" autocomplete="off"
             placeholder="Masukkan 6 karakter CAPTCHA" required>
      <button type="submit">Kirim OTP login</button>
    </form>
    <form id="otp-verify-form">
      <input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 digit OTP" required>
      <button type="submit">Verifikasi OTP</button>
    </form>
  </section>

  <section>
    <h2>Hasil API</h2>
    <button id="me-button" type="button">Tes access token ke /me/</button>
    <pre id="result">Belum ada request.</pre>
  </section>

  {{ google_client_id|json_script:"google-client-id" }}
  <script>
    const clientId = JSON.parse(document.getElementById("google-client-id").textContent);
    const result = document.getElementById("result");
    let accessToken = null;
    let captchaId = null;

    async function callApi(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json();
      if (data.access) accessToken = data.access;
      result.textContent = JSON.stringify({status: response.status, data}, null, 2);
      return data;
    }

    async function loadCaptcha() {
      const response = await fetch("/api/v1/auth/captcha/login-otp/", {method: "POST"});
      const data = await response.json();
      if (!response.ok) {
        result.textContent = JSON.stringify({status: response.status, data}, null, 2);
        captchaId = null;
        return;
      }
      captchaId = data.captcha_id;
      document.getElementById("captcha-image").src = data.image;
      document.getElementById("captcha-answer").value = "";
    }

    window.addEventListener("load", () => {
      loadCaptcha();
      if (!clientId) {
        document.getElementById("google-setup").textContent =
          "GOOGLE_OAUTH_CLIENT_ID belum diisi di .env.";
        return;
      }
      google.accounts.id.initialize({
        client_id: clientId,
        callback: ({credential}) => callApi("/api/v1/auth/login/google/", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({credential}),
        }),
      });
      google.accounts.id.renderButton(
        document.getElementById("google-button"),
        {theme: "outline", size: "large", text: "signin_with"}
      );
    });

    document.getElementById("otp-request-form").addEventListener("submit", async event => {
      event.preventDefault();
      const captchaAnswer = document.getElementById("captcha-answer").value;
      if (!captchaId || captchaAnswer.length !== 6) {
        result.textContent = "Masukkan 6 karakter CAPTCHA terlebih dahulu.";
        return;
      }
      await callApi("/api/v1/auth/login/otp/request/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          email: document.getElementById("email").value,
          captcha_id: captchaId,
          captcha_answer: captchaAnswer,
        }),
      });
      await loadCaptcha();
    });

    document.getElementById("captcha-refresh").addEventListener("click", loadCaptcha);

    document.getElementById("otp-verify-form").addEventListener("submit", event => {
      event.preventDefault();
      callApi("/api/v1/auth/login/otp/verify/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          email: document.getElementById("email").value,
          code: document.getElementById("code").value,
        }),
      });
    });

    document.getElementById("me-button").addEventListener("click", () => {
      if (!accessToken) {
        result.textContent = "Login terlebih dahulu agar access token tersedia.";
        return;
      }
      callApi("/api/v1/auth/me/", {
        headers: {Authorization: `Bearer ${accessToken}`},
      });
    });
  </script>
</body>
</html>
